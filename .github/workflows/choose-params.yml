name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Deploy
        run: echo "Deploying to ${{ inputs.environment }}"